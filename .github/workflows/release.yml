name: Release skill zip

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/check.py
      - name: Build skill zip for Claude upload
        run: |
          cd plugins/necx-outreach/skills
          zip -r ../../../necx-outreach-planner.zip necx-outreach-planner
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            necx-outreach-planner.zip \
            playbook/necx-outreach-playbook.md \
            chatgpt/custom-gpt-setup.md \
            --title "${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md. Claude: upload necx-outreach-planner.zip. ChatGPT: re-paste the Instructions block and re-upload the playbook."
